<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트폰 실력 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 한 줄 설계: 미색 바탕 위에 큰 글씨와 큰 단추, 한 화면에 질문 하나씩 */
:root {
  --bg: #FAF8F5;
  --card: #FFFFFF;
  --ink: #2A2622;
  --muted: #6B645C;
  --line: #E3DDD3;
  --green: #1E4D2B;
  --green-soft: #E3EDE5;
  --wine: #781B33;
  --amber: #7A4E00;
  --amber-soft: #FBF1DC;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 20px/1.7 var(--font); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
.eyebrow { font-size: 16px; color: var(--green); font-weight: 700; letter-spacing: .02em; }
h1 { font-size: 32px; line-height: 1.35; color: var(--wine); margin: 6px 0 14px; font-weight: 700; text-wrap: balance; }
h2 { font-size: 24px; line-height: 1.4; color: var(--wine); margin: 0 0 12px; font-weight: 700; text-wrap: balance; }
p { margin: 0 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; margin-bottom: 18px; }
.steps { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.steps b.n { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--green-soft); color: var(--green); font-weight: 700; }
.btn { display: block; width: 100%; min-height: 60px; padding: 14px 18px; border: 0; border-radius: 14px; background: var(--green); color: #fff; font: 700 21px/1.4 var(--font); cursor: pointer; }
.btn.ghost { background: #fff; color: var(--green); border: 2px solid var(--green); }
.btn + .btn { margin-top: 12px; }
button:focus-visible { outline: 4px solid #C9A227; outline-offset: 2px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 17px; color: var(--muted); }
.tag { background: var(--green-soft); color: var(--green); font-weight: 700; border-radius: 999px; padding: 2px 14px; font-size: 17px; }
.tag.rev { background: var(--amber-soft); color: var(--amber); }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 999px; }
.q { font-size: 24px; line-height: 1.55; font-weight: 700; margin: 0 0 18px; text-wrap: balance; }
.opt { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: start; width: 100%; text-align: left; min-height: 64px; padding: 14px 16px; margin: 0 0 12px; font: 500 20px/1.55 var(--font); color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
.opt .m { color: var(--green); font-weight: 700; }
.opt:disabled { cursor: default; }
.opt.off { background: #F0ECE5; color: var(--muted); border-style: dashed; }
.opt.right { background: var(--green-soft); border-color: var(--green); }
.note { border-radius: 14px; padding: 16px 18px; margin: 6px 0 16px; }
.note.hint { background: var(--amber-soft); color: var(--amber); }
.note.good { background: var(--green-soft); color: var(--green); }
.note.soft { background: #F3EFE8; color: var(--ink); }
.note b { display: block; margin-bottom: 4px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row:last-of-type { border-bottom: 0; }
.row .stars { color: var(--green); font-size: 26px; letter-spacing: .1em; }
.row .lv { grid-column: 1 / -1; font-size: 17px; color: var(--muted); margin-top: -4px; }
.big { font-size: 40px; font-weight: 700; color: var(--green); line-height: 1.2; }
.prompt { background: #F3EFE8; border-radius: 14px; padding: 16px 18px; font-size: 19px; user-select: all; margin: 10px 0 14px; }
.small { font-size: 17px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .3s; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var SKILLS = ['전화와 문자', '사진과 카메라', '카카오톡', '사기 조심하기'];
/* o[0]이 정답. 화면에 나올 때 순서가 섞입니다. */
var Q = [
  { s: 0, q: '통화 중인데 상대방 목소리가 너무 작게 들려요. 어떻게 하면 될까요?',
    o: ['폰 옆면의 소리 크기 단추를 올린다', '폰 전원을 끈다', '사진을 한 장 찍는다', '화면을 어둡게 한다'],
    h: '소리를 키우는 단추는 폰 옆면에 달려 있어요. 위쪽 단추일까요, 아래쪽 단추일까요?',
    e: '폰 옆면에 있는 소리 크기 단추 중 위쪽을 누르면 소리가 커져요.' },
  { s: 0, q: '문자를 쓰려는데 글자판이 보이지 않아요. 어디를 눌러야 할까요?',
    o: ['글을 쓰는 칸(입력창)', '전원 단추', '화면 맨 위 시계', '폰 뒷면'],
    h: '글자판은 글을 쓰려고 할 때 나타나요. 글을 쓰는 자리는 어디일까요?',
    e: '글을 쓰는 칸을 한 번 누르면 글자판이 올라와요.' },
  { s: 0, q: '손가락 대신 말로 문자를 쓰고 싶어요. 글자판에서 어떤 모양을 누를까요?',
    o: ['마이크 모양', '카메라 모양', '자물쇠 모양', '별 모양'],
    h: '내 목소리를 받아들이는 기계 이름을 떠올려 보세요.',
    e: '마이크 모양을 누르고 말하면 말이 글자로 바뀌어요.' },

  { s: 1, q: '사진을 찍으려고 해요. 가장 먼저 눌러야 하는 것은 무엇일까요?',
    o: ['카메라 그림', '계산기 그림', '시계 그림', '날씨 그림'],
    h: '사진을 찍는 기계 이름이 그대로 그림 이름이에요.',
    e: '카메라 그림을 누르면 사진을 찍을 수 있어요.' },
  { s: 1, q: '방금 찍은 사진을 다시 보고 싶어요. 어디로 들어가야 할까요?',
    o: ['갤러리(앨범)', '계산기', '시계', '날씨'],
    h: '그림을 모아 두는 곳을 미술관이나 앨범이라고 하죠. 폰에서는 뭐라고 부를까요?',
    e: '찍은 사진은 갤러리나 앨범에 차곡차곡 모여 있어요.' },
  { s: 1, q: '사진이 너무 많아서 폰 저장 공간이 꽉 찼어요. 어떻게 하면 좋을까요?',
    o: ['소중한 사진은 따로 보관해 두고, 필요 없는 사진부터 지운다', '폰을 새로 산다', '전원을 하루 동안 꺼 둔다', '화면 밝기를 낮춘다'],
    h: '새로 사기 전에 해 볼 일이 있어요. 집이 꽉 찼을 때 어떻게 하시나요?',
    e: '추억이 담긴 사진은 가족에게 보내 두거나 따로 옮겨 놓고, 흐릿하거나 겹친 사진부터 지우면 돼요.' },

  { s: 2, q: '카카오톡으로 친구에게 글을 보내려면 어떻게 할까요?',
    o: ['대화창에 글을 쓰고 전송 단추를 누른다', '폰을 세게 흔든다', '소리 크기 단추를 길게 누른다', '전원 단추를 두 번 누른다'],
    h: '글을 다 쓰고 나면 보내는 단추가 옆에 나타나요. 편지를 우체통에 넣는 것과 같아요.',
    e: '글을 쓴 뒤 전송 단추를 눌러야 상대에게 가요.' },
  { s: 2, q: '카카오톡에 잘못 보낸 글을 지우고 싶어요. 어떻게 할까요?',
    o: ['보낸 글을 꾹 눌러서 삭제를 고른다', '폰을 껐다 켠다', '카카오톡을 지웠다가 다시 깐다', '상대방이 안 보길 기도한다'],
    h: '지우고 싶은 글 바로 위에서 손가락을 오래 대고 있으면 메뉴가 나타나요.',
    e: '글을 꾹 누르면 메뉴가 나오고, 거기서 삭제를 고르면 돼요. 보낸 지 오래되면 상대 화면에서는 안 지워질 수 있으니 빨리 지우세요.' },
  { s: 2, q: '단체 대화방 알림이 하루 종일 울려서 힘들어요. 어떻게 할까요?',
    o: ['그 대화방의 알림만 끈다', '카카오톡을 아예 지운다', '폰을 서랍에 넣는다', '대화방 친구들을 모두 차단한다'],
    h: '대화방을 떠나지 않고도 소리만 조용히 만들 수 있어요. 대화방 안쪽 메뉴를 찾아보세요.',
    e: '대화방 알림만 끄면 글은 그대로 볼 수 있고, 소리만 조용해져요.' },

  { s: 3, q: '모르는 번호로 문자가 왔어요. "엄마, 폰이 고장 났어. 급하게 돈 좀 보내줘." 가장 먼저 할 일은 무엇일까요?',
    o: ['원래 알던 자녀 번호로 직접 전화해서 확인한다', '바로 돈을 보낸다', '문자로 계좌번호를 물어본다', '문자 속 링크를 눌러 본다'],
    h: '진짜 자녀라면 원래 쓰던 번호로 전화하면 받겠죠? 새 번호 말고 어느 번호로 걸어야 할까요?',
    e: '이런 문자는 자녀를 사칭한 사기예요. 꼭 원래 알던 번호로 직접 전화해서 확인하세요.' },
  { s: 3, q: '문자에 "건강검진 결과를 확인하세요"라는 말과 함께 인터넷 주소가 붙어 왔어요. 어떻게 할까요?',
    o: ['누르지 않고 지운다. 궁금하면 병원에 직접 전화한다', '궁금하니까 일단 눌러 본다', '가족 단체방에 주소를 보낸다', '주소를 눌러 이름과 주민번호를 넣는다'],
    h: '모르는 곳에서 온 주소를 눌렀을 때 생길 수 있는 일을 생각해 보세요. 확인은 어디로 해야 안전할까요?',
    e: '모르는 주소를 누르면 폰에 나쁜 프로그램이 깔릴 수 있어요. 확인은 늘 직접 병원이나 기관에 해야 안전해요.' },
  { s: 3, q: '전화로 "검찰입니다. 안전한 계좌로 돈을 옮기세요"라고 해요. 어떻게 할까요?',
    o: ['바로 끊고, 해당 기관 대표번호로 직접 확인한다', '시키는 대로 돈을 옮긴다', '통장 비밀번호를 알려준다', '시키는 앱을 설치한다'],
    h: '진짜 수사기관이 전화로 돈을 어디로 옮기라고 할까요? 그런 일이 있을 수 있는지 생각해 보세요.',
    e: '수사기관과 은행은 전화로 돈을 옮기라고 하지 않아요. 끊고 직접 확인하는 것이 가장 안전해요.' }
];

var PROMPT = '나한테 ○○을 가르쳐줘. 먼저 내가 얼마나 아는지 질문으로 확인해 줘. 내가 틀려도 답을 바로 알려주지 말고, 생각할 수 있게 힌트만 줘. 며칠 뒤에는 예전에 틀린 문제도 다시 물어봐 줘.';
var MARK = ['①', '②', '③', '④'];
var app = document.getElementById('app');
var S = null;

function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function intro() {
  S = null;
  app.innerHTML =
    '<div class="eyebrow">오십의 디지털 노트</div>' +
    '<h1>스마트폰 실력 점검</h1>' +
    '<p>정답을 바로 알려주지 않는 질문지예요. 정답을 받아 적는 공부보다, 스스로 생각해서 찾은 것이 오래 남아요.</p>' +
    '<div class="card"><ul class="steps">' +
    '<li><b class="n">1</b><span>네 가지 분야에서 문제를 3개씩, 모두 12문제를 풀어요.</span></li>' +
    '<li><b class="n">2</b><span>틀리면 정답 대신 <b>힌트</b>를 드려요. 한 번 더 생각해 보세요.</span></li>' +
    '<li><b class="n">3</b><span>끝나면 헷갈렸던 문제를 <b>한 번 더</b> 물어봐요.</span></li>' +
    '<li><b class="n">4</b><span>분야마다 별 0개에서 3개까지 점수를 드려요.</span></li>' +
    '</ul></div>' +
    '<p class="small">걸리는 시간은 5분쯤이에요. 틀려도 괜찮아요.</p>' +
    '<button class="btn" data-act="start">시작하기</button>';
}

function begin() {
  S = { phase: 'quiz', mode: 'quiz', queue: Q.map(function (_, i) { return i; }), pos: 0, first: {}, review: {}, missed: [] };
  enter();
}

function enter() {
  S.cur = { qi: S.queue[S.pos], order: shuffle([0, 1, 2, 3]), tries: 0, off: [], done: false, ok: false };
  draw();
}

function rec(v) {
  var qi = S.cur.qi;
  if (S.mode === 'quiz') S.first[qi] = v; else S.review[qi] = v;
}

function pick(i) {
  var c = S.cur;
  if (c.done || c.off.indexOf(i) >= 0) return;
  if (i === 0) {
    if (c.tries === 0) rec(true);
    c.done = true; c.ok = true;
  } else {
    c.tries++;
    c.off.push(i);
    if (c.tries === 1) rec(false);
    if (c.tries >= 2) { c.done = true; c.ok = false; }
  }
  draw();
}

function next() {
  S.pos++;
  if (S.pos >= S.queue.length) {
    if (S.mode === 'quiz') {
      S.missed = S.queue.filter(function (q) { return !S.first[q]; });
      S.phase = S.missed.length ? 'reviewIntro' : 'result';
    } else {
      S.phase = 'result';
    }
    draw();
  } else {
    enter();
  }
}

function startReview() {
  S.mode = 'review';
  S.queue = shuffle(S.missed);
  S.pos = 0;
  S.phase = 'quiz';
  enter();
}

function draw() {
  if (S.phase === 'quiz') return drawQuiz();
  if (S.phase === 'reviewIntro') return drawReviewIntro();
  return drawResult();
}

function drawQuiz() {
  var c = S.cur, q = Q[c.qi];
  var total = S.queue.length;
  var pct = Math.round((S.pos + (c.done ? 1 : 0)) / total * 100);
  var h = '<div class="top"><span class="tag' + (S.mode === 'review' ? ' rev' : '') + '">' +
    (S.mode === 'review' ? '복습 · ' : '') + SKILLS[q.s] + '</span><span>' + (S.pos + 1) + ' / ' + total + '</span></div>' +
    '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>' +
    '<p class="q">' + q.q + '</p>';
  c.order.forEach(function (oi, k) {
    var off = c.off.indexOf(oi) >= 0;
    var right = c.done && oi === 0;
    var cls = 'opt' + (off ? ' off' : '') + (right ? ' right' : '');
    h += '<button class="' + cls + '" data-act="pick" data-i="' + oi + '"' + ((off || c.done) ? ' disabled' : '') + '>' +
      '<span class="m">' + MARK[k] + '</span><span>' + q.o[oi] + '</span></button>';
  });
  if (!c.done && c.tries === 1) {
    h += '<div class="note hint" role="status"><b>아쉬워요. 정답은 바로 알려드리지 않을게요.</b>힌트: ' + q.h + '</div>';
  }
  if (c.done && c.ok) {
    h += '<div class="note good" role="status"><b>' + (c.tries === 0 ? '맞아요! 잘하셨어요.' : '힌트로 맞히셨어요. 잘하셨어요.') + '</b>' + q.e + '</div>';
  }
  if (c.done && !c.ok) {
    h += '<div class="note soft" role="status"><b>괜찮아요. 정답은 초록색 칸이에요.</b>' + q.e +
      (S.mode === 'quiz' ? ' 뒤에서 한 번 더 물어볼게요.' : '') + '</div>';
  }
  if (c.done) {
    var last = S.pos + 1 >= S.queue.length;
    h += '<button class="btn" data-act="next">' + (last ? (S.mode === 'quiz' ? '다음으로' : '결과 보기') : '다음 문제') + '</button>';
  }
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function drawReviewIntro() {
  app.innerHTML =
    '<div class="eyebrow">잠깐 쉬어가요</div>' +
    '<h2>아까 헷갈렸던 문제를 다시 물어볼게요</h2>' +
    '<div class="card"><p>기억은 잊어버릴 때쯤 다시 꺼내 봐야 단단해져요. 방금 풀 때 힌트가 필요했거나 틀린 문제 <b>' + S.missed.length + '개</b>를 한 번 더 풀어 봐요.</p></div>' +
    '<button class="btn" data-act="review">다시 풀어보기</button>';
  window.scrollTo(0, 0);
}

function drawResult() {
  var counts = SKILLS.map(function () { return 0; });
  var ok = 0;
  Q.forEach(function (q, i) { if (S.first[i]) { counts[q.s]++; ok++; } });
  var minV = Math.min.apply(null, counts);
  var weak = [];
  counts.forEach(function (n, k) { if (n === minV) weak.push(SKILLS[k]); });
  var lvText = ['아직 처음이에요', '조금 알아요', '꽤 잘 알아요', '아주 잘 알아요'];
  var h = '<div class="eyebrow">끝까지 하셨어요</div><h2>오늘의 결과</h2>' +
    '<div class="card"><div class="small">한 번에 맞힌 문제</div><div class="big">' + ok + ' / ' + Q.length + '</div>';
  var rv = Object.keys(S.review);
  if (rv.length) {
    var rok = rv.filter(function (k) { return S.review[k]; }).length;
    h += '<p class="small" style="margin-top:8px">다시 물어본 ' + rv.length + '문제 중 ' + rok + '문제는 이번엔 바로 맞히셨어요.</p>';
  } else {
    h += '<p class="small" style="margin-top:8px">다시 물어볼 문제가 없었어요. 대단해요!</p>';
  }
  h += '</div><div class="card"><h2 style="font-size:22px">분야별 별점</h2>';
  counts.forEach(function (n, k) {
    var stars = '★'.repeat(n) + '☆'.repeat(3 - n);
    h += '<div class="row"><span>' + SKILLS[k] + '</span><span class="stars" aria-label="별 3개 중 ' + n + '개">' + stars + '</span><span class="lv">' + lvText[n] + '</span></div>';
  });
  h += '</div>';
  if (minV === 3) {
    h += '<div class="note good"><b>모든 분야가 만점이에요!</b>이제 다른 주제로 도전해 보세요.</div>';
  } else {
    h += '<div class="note hint"><b>다음에는 이 분야부터 연습해 보세요.</b>' + weak.join(', ') + '</div>';
  }
  h += '<div class="card"><h2 style="font-size:22px">인공지능 선생님께도 이렇게 부탁해 보세요</h2>' +
    '<p>다른 공부도 이 방식으로 할 수 있어요. 아래 글에서 ○○ 자리에 배우고 싶은 것을 넣어 대화창에 붙여 넣어 보세요.</p>' +
    '<div class="prompt" id="prompt">' + PROMPT + '</div>' +
    '<button class="btn ghost" data-act="copy" id="copybtn">이 글 복사하기</button></div>' +
    '<button class="btn" data-act="again">처음부터 다시 풀기</button>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function copyPrompt() {
  var b = document.getElementById('copybtn');
  function done(ok) { b.textContent = ok ? '복사했어요' : '위 글을 꾹 눌러서 복사해 주세요'; }
  try {
    navigator.clipboard.writeText(PROMPT).then(function () { done(true); }, function () { done(false); });
  } catch (e) { done(false); }
}

app.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'start' || a === 'again') begin();
  else if (a === 'pick') pick(parseInt(t.getAttribute('data-i'), 10));
  else if (a === 'next') next();
  else if (a === 'review') startReview();
  else if (a === 'copy') copyPrompt();
});

intro();
</script>
</body>
</html>
